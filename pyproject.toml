[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aobasis"
version = "1.2.0"
description = "Modal basis sets for adaptive optics deformable mirrors: KL, Zernike, Fourier, Hadamard, zonal"
readme = "README.md"
authors = [{ name = "Jacob Taylor", email = "jacobataylor7@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["adaptive optics", "deformable mirror", "Karhunen-Loeve", "Zernike", "modal basis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]
requires-python = ">=3.8"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
dev = [
    "matplotlib>=3.5",
    "pytest",
    "pytest-cov",
    "imageio",
]

[project.urls]
"Homepage" = "https://github.com/jacotay7/aobasis"
"Bug Tracker" = "https://github.com/jacotay7/aobasis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aobasis = ["py.typed"]
