name: CI

on:
  push:
    branches: [ main ]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run tests
      run: |
        pytest --cov=src/aobasis --cov-fail-under=80

  test-arm:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run tests
      run: pytest

  test-no-plot:
    # The library install, without the plot extra: plotting tests skip and
    # the "matplotlib is optional" tests run against a real missing package.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest
    - name: Check matplotlib is absent
      run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('matplotlib') is not None)"
    - name: Run tests
      run: pytest

  tutorials:
    # Execute every tutorial notebook, so they stay in step with the code.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[tutorials] nbconvert ipykernel
    - name: Execute notebooks
      run: |
        jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/executed" tutorials/*.ipynb
